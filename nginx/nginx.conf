# LivePulse reverse proxy (Phase 9.2 single upstream → Phase 9.3 dual).
# Proves Nginx passes through BOTH plain HTTP and the raw WebSocket
# upgrade the app owns at /ws. Replicas arrive here (9.3); load-balancing
# policy beyond round-robin does not.
#
# Design notes:
# - `upgrade`/`connection` headers switch on $http_upgrade so non-upgrade
#   requests proxy as plain HTTP/1.1 and only real upgrades get the
#   `Upgrade` handshake treatment. No path-based WS special-casing: the app
#   answers non-upgrade GET /ws with 426 itself, and that response must
#   pass through untouched.
# - Timeouts: the app heartbeats WS peers every 30 s (each frame resets
#   Nginx's read timer), so 120 s read/send timeouts give 4× headroom
#   without masking a genuinely dead upstream.
# - No sticky sessions, no ip_hash, no load balancing: exactly one
#   `server` in the upstream. Deliberately nothing to remove later.
# - No TLS/auth/rate limiting here — later phases.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Empty for plain HTTP, "upgrade" only when the client asked to upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Phase 9.3: two independent upstreams, plain round-robin. No ip_hash,
  # no sticky sessions: placement must not matter for correctness, and the
  # 9.3 test verifies which instance served each connection instead of
  # assuming it (see X-Upstream-App below).
  upstream livepulse {
    server app-1:3000;
    server app-2:3000;
    keepalive 32;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://livepulse;
      proxy_http_version 1.1;

      # Preserve host + client identity for logs and any future auth.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket upgrade handshake (no-op for plain HTTP requests).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Placement observability for the 9.3 cross-instance test: echoes the
      # upstream that served THIS response (IP:port on the Compose network).
      # Not routing, not stickiness — a measurement header. Clients read it
      # on the WS 101 response to prove which instance they landed on.
      add_header X-Upstream-App $upstream_addr always;

      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }
  }
}
